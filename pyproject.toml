[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverit"
version = "0.1.0"
description = "Source-neutral CI/CD incident investigation and hypothesis ranking"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "rich>=13.0,<16.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "langgraph>=1.2.14,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.1,<3.2",
    "aiosqlite>=0.22,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["contracts*", "ingestion*", "collectors*", "evidence*", "timeline*", "investigation*", "reasoning*", "integration_runtime*", "recoverit*"]

[tool.setuptools.package-data]
"recoverit.web" = ["static/*"]

[tool.unittest]
start-directory = "tests"
