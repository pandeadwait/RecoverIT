[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverit-contracts"
version = "0.1.0"
description = "Technology-neutral contracts for RecoverIT incident investigation."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["contracts", "contracts.incident", "contracts.collection", "contracts.evidence", "contracts.timeline", "contracts.context"]

[tool.unittest]
start-directory = "tests"
